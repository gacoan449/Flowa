name: pasar_komunitas
description: Marketplace lokal Flowa.
publish_to: "none"
version: 0.1.0+2
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  http: ^1.2.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/flowa_logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/flowa_logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/flowa_logo.jpg"
