name: flowa
description: "Aplikasi komunitas berbagi video pendek terintegrasi ekosistem DesaPay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Paket Lengkap Koneksi Server Database Firebase Proyek Anda (desapay-10614)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^11.0.0 # Paket Baru Penyimpanan Berkas Fisik Video

  # Paket Utama untuk Fitur Utama Flowa (Kreator & Video)
  video_player: ^2.9.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # PUSTAKA GENERATOR IKON: Bahan untuk mencetak ikon otomatis di server awan
  flutter_launcher_icons: ^0.13.1

# KONFIGURASI RAHASIA IKON RESMI APP FLOWA
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png" # Membaca file gambar logo.png yang Anda taruh di folder utama
