name: flowa
description: "Aplikasi komunitas berbagi video pendek terintegrasi ekosistem DesaPay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Paket Wajib untuk Koneksi Server Database Firebase Anda
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Paket Utama untuk Fitur Utama Flowa (Kreator & Video)
  video_player: ^2.9.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
