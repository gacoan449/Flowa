name: flowa
description: "Aplikasi komunitas berbagi video pendek terintegrasi ekosistem DesaPay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PERBAIKAN: Paket Koneksi Server Database Firebase yang Sudah Diselaraskan (Bebas Bentrok!)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.4.10 # <-- Diubah ke versi mutakhir sesuai saran sistem Flutter

  # Paket Utama untuk Fitur Utama Flowa (Kreator & Video)
  video_player: ^2.9.2
  image_picker: ^1.1.2

  # ==========================================
  # [UPGRADE CTO] PAKET PREMIUM & STATE MANAGEMENT
  # ==========================================
  provider: ^6.1.2             # WAJIB: Untuk menjalankan video_feed_provider.dart Anda
  cached_network_image: ^3.3.1 # WAJIB: Caching gambar/thumbnail agar aplikasi tidak lag
  google_fonts: ^6.2.1         # UI MEWAH: Tipografi bersih dan modern tanpa repot atur aset font
  cupertino_icons: ^1.0.6      # Standar ikonografi UI modern

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # PUSTAKA GENERATOR IKON: Bahan untuk mencetak ikon otomatis di server awan
  flutter_launcher_icons: ^0.13.1

# KONFIGURASI RAHASIA IKON RESMI APP FLOWA
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png" # Membaca file gambar logo.png yang Anda taruh di folder utama
