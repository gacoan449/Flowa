name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Configure Android application ID
        run: |
          sed -i 's/com\.example\.pasar_komunitas/com.flowa.app/g' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          sed -i 's/com\.example\.pasar_komunitas/com.flowa.app/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-release
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
