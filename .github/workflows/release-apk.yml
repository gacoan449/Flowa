name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform project
        run: flutter create --platforms=android .

      - name: Add microphone and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in ['android.permission.RECORD_AUDIO', 'android.permission.POST_NOTIFICATIONS', 'android.permission.ACCESS_COARSE_LOCATION', 'android.permission.ACCESS_FINE_LOCATION']:
              tag = '    <uses-permission android:name="' + permission + '" />' + '\n'
              if permission not in s:
                  s = s.replace('<application', tag + '    <application', 1)
          p.write_text(s)
          PY

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = build_file.read_text()
          kotlin_dsl = build_file.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          def find_block(text, name):
              match = re.search(r"\b" + re.escape(name) + r"\s*\{", text)
              if not match:
                  return None
              opening = text.find("{", match.start())
              depth = 0
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, pos
              raise SystemExit("Unclosed Gradle block: " + name)

          android = find_block(source, "android")
          if android is None:
              raise SystemExit("Missing android block in " + str(build_file))
          a_open, a_close = android
          android_body = source[a_open + 1:a_close]
          compile_options = find_block(android_body, "compileOptions")
          if compile_options is None:
              source = source[:a_close] + "\n    compileOptions {\n        " + enabled + "\n    }\n" + source[a_close:]
          else:
              _, c_close = compile_options
              compile_body = android_body[compile_options[0] + 1:c_close]
              if "isCoreLibraryDesugaringEnabled" not in compile_body and "coreLibraryDesugaringEnabled" not in compile_body:
                  absolute = a_open + 1 + c_close
                  source = source[:absolute] + "\n        " + enabled + source[absolute:]

          deps = find_block(source, "dependencies")
          if deps is None:
              source += "\ndependencies {\n    " + dependency + "\n}\n"
          else:
              _, d_close = deps
              dep_body = source[deps[0] + 1:d_close]
              if "desugar_jdk_libs" not in dep_body:
                  source = source[:d_close] + "\n    " + dependency + source[d_close:]

          build_file.write_text(source)
          print("Configured core library desugaring in", build_file)
          PY

      - name: Restore Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name"' android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Set Flowa app name and generate launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="pasar_komunitas"', 'android:label="Flowa"')
          s = s.replace('android:label="com.example.pasar_komunitas"', 'android:label="Flowa"')
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="Flowa"', s, count=1)
          p.write_text(s)
          PY
          dart run flutter_launcher_icons

      - name: Validate Cloud Functions JavaScript syntax
        run: node --check functions/index.js

      - name: Analyze project
        run: flutter analyze lib --no-fatal-infos

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-pwa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Web platform
        run: flutter create --platforms=web .

      - name: Configure Firebase Web app
        env:
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          if [ -z "$FIREBASE_WEB_APP_ID" ]; then
            echo "::error::Tambahkan GitHub Actions secret FIREBASE_WEB_APP_ID dari Firebase Console > Project settings > Your apps > Web app."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/firebase_options.dart')
          s = p.read_text()
          s = s.replace("import 'package:flutter/foundation.dart' show TargetPlatform, defaultTargetPlatform;", "import 'package:flutter/foundation.dart' show TargetPlatform, defaultTargetPlatform, kIsWeb;")
          marker = "  static FirebaseOptions get currentPlatform {\n"
          web = """  static FirebaseOptions get currentPlatform {
            if (kIsWeb) {
              const webAppId = String.fromEnvironment('FIREBASE_WEB_APP_ID');
              if (webAppId.isEmpty) {
                throw UnsupportedError('FIREBASE_WEB_APP_ID belum dikonfigurasi.');
              }
              return const FirebaseOptions(
                apiKey: 'AIzaSyArsKK5zAgLlE0DfLs_RDOL1qbYutOCWzQ',
                appId: webAppId,
                messagingSenderId: '1099448464104',
                projectId: 'flowa-d6d47',
                authDomain: 'flowa-d6d47.firebaseapp.com',
                storageBucket: 'flowa-d6d47.firebasestorage.app',
              );
            }
          """
          if "if (kIsWeb)" not in s:
              s = s.replace(marker, web, 1)
          p.write_text(s)
          PY
          echo "Firebase Web config will be injected at build time."

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Flowa PWA metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('web/manifest.json')
          data = json.loads(p.read_text())
          data.update({
            'name': 'Flowa - Marketplace',
            'short_name': 'Flowa',
            'description': 'Marketplace lokal Flowa untuk jual beli dan terhubung dengan penjual.',
            'start_url': './',
            'scope': './',
            'display': 'standalone',
            'background_color': '#ffffff',
            'theme_color': '#1769e8',
            'orientation': 'portrait-primary',
            'prefer_related_applications': False,
            'categories': ['shopping', 'business']
          })
          data['icons'] = [
            {'src': 'icons/Icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
            {'src': 'icons/Icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
            {'src': 'icons/Icon-maskable-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'maskable'},
            {'src': 'icons/Icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'}
          ]
          p.write_text(json.dumps(data, indent=2) + '\n')
          index = Path('web/index.html')
          html = index.read_text()
          html = html.replace('<title>Flutter Demo</title>', '<title>Flowa - Marketplace</title>')
          html = html.replace('<meta name="description" content="A new Flutter project." />', '<meta name="description" content="Flowa - Marketplace lokal untuk jual beli." />')
          if 'name="theme-color"' not in html:
              html = html.replace('<head>', '<head>\n  <meta name="theme-color" content="#1769e8">', 1)
          index.write_text(html)
          PY

      - name: Build installable PWA
        run: flutter build web --release --base-href "/Flowa/" --dart-define=FIREBASE_WEB_APP_ID="${{ secrets.FIREBASE_WEB_APP_ID }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy PWA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
