name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform project
        run: flutter create --platforms=android .

      - name: Add microphone and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in ['android.permission.RECORD_AUDIO', 'android.permission.POST_NOTIFICATIONS', 'android.permission.ACCESS_COARSE_LOCATION', 'android.permission.ACCESS_FINE_LOCATION']:
              tag = '    <uses-permission android:name="' + permission + '" />' + '\n'
              if permission not in s:
                  s = s.replace('<application', tag + '    <application', 1)
          p.write_text(s)
          PY

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          build_file = next((p for p in candidates if p.is_file()), None)
          if build_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = build_file.read_text()
          kotlin_dsl = build_file.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if kotlin_dsl else "coreLibraryDesugaringEnabled true"
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kotlin_dsl else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          def find_block(text, name):
              match = re.search(r"\b" + re.escape(name) + r"\s*\{", text)
              if not match:
                  return None
              opening = text.find("{", match.start())
              depth = 0
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, pos
              raise SystemExit("Unclosed Gradle block: " + name)

          android = find_block(source, "android")
          if android is None:
              raise SystemExit("Missing android block in " + str(build_file))
          a_open, a_close = android
          android_body = source[a_open + 1:a_close]
          compile_options = find_block(android_body, "compileOptions")
          if compile_options is None:
              source = source[:a_close] + "\n    compileOptions {\n        " + enabled + "\n    }\n" + source[a_close:]
          else:
              _, c_close = compile_options
              compile_body = android_body[compile_options[0] + 1:c_close]
              if "isCoreLibraryDesugaringEnabled" not in compile_body and "coreLibraryDesugaringEnabled" not in compile_body:
                  absolute = a_open + 1 + c_close
                  source = source[:absolute] + "\n        " + enabled + source[absolute:]

          deps = find_block(source, "dependencies")
          if deps is None:
              source += "\ndependencies {\n    " + dependency + "\n}\n"
          else:
              _, d_close = deps
              dep_body = source[deps[0] + 1:d_close]
              if "desugar_jdk_libs" not in dep_body:
                  source = source[:d_close] + "\n    " + dependency + source[d_close:]

          build_file.write_text(source)
          print("Configured core library desugaring in", build_file)
          PY

      - name: Restore Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name"' android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze lib --no-fatal-infos

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
