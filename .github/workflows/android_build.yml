name: Build Android APK (Flowa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Proses Kompilasi APK Otomatis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Otomatis membuat folder Android bawaan jika belum ada
      - name: Generate Android Folder Automatically
        run: flutter create . --platforms=android --org Flowa

      # Menyinkronkan file rahasia Firebase ke posisi yang tepat
      - name: Setup Firebase Config File
        run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      - name: Mengunduh Paket Dependencies
        run: flutter pub get

      # SOLUSI: Build mode release murni dengan pembagian arsitektur HP (Split ABI)
      - name: Build APK Release Ringan
        run: flutter build apk --release --split-per-abi

      # PENTING: Jalur path di bawah ini dikunci ketat HANYA mengambil file .apk saja
      # Ini akan membuang ratusan megabyte file sampah ruang kerja yang tidak berguna!
      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-Release-APK
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7
