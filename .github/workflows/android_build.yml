name: Build Android APK (Flowa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Proses Kompilasi APK Otomatis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menyiapkan lingkungan Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Menyiapkan Flutter
      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Otomatis membuat folder Android bawaan jika belum ada
      - name: Generate Android Folder Automatically
        run: flutter create . --platforms=android --org Flowa

      # Menyinkronkan file rahasia Firebase ke posisi yang tepat
      - name: Setup Firebase Config File
        run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      # Mengunduh paket dependencies
      - name: Mengunduh Paket Dependencies
        run: flutter pub get

      # TRIK RAHASIA ANDA: Menggunakan mode debug agar Gradle langsung melahirkan APK tanpa menanyakan Keystore
      - name: Build APK Tanpa Hambatan Keystore
        run: flutter build apk --debug --split-per-abi

      # Mengambil seluruh file APK yang dihasilkan di semua subfolder keluaran
      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-Testing-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/debug/*.apk
          retention-days: 7
