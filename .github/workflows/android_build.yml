name: Build Android APK (Flowa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Proses Kompilasi APK Otomatis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Otomatis membuat folder Android bawaan dan langsung menyuntikkan izin INTERNET & GALERI VIDEO NYATA ke sistem batin Android
      - name: Generate Android Folder Automatically
        run: |
          flutter create . --platforms=android --org Flowa
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>' android/app/src/main/AndroidManifest.xml

      # Menyinkronkan file rahasia JSON Firebase desapay-10614 milik Anda ke posisi arsitektur yang tepat
      - name: Setup Firebase Config File
        run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          fi

      - name: Mengunduh Paket Dependencies
        run: flutter pub get

      # Memulai perakitan mode release murni dengan pembagian 3 jenis arsitektur arsitektur HP (Split ABI)
      - name: Build APK Release Ringan
        run: flutter build apk --release --split-per-abi

      # PENTING: Jalur path di bawah ini dikunci ketat HANYA mengambil file berakhiran -release.apk saja
      # Ini adalah kunci rahasia agar file sampah 277MB dibuang total dan menyisakan file belasan MB saja
      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-Release-APK
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7
