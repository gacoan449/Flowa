name: Build Android APK (Flowa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Proses Kompilasi APK Otomatis
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode terbaru dari repositori GitHub Anda
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan sistem Java (Wajib untuk build Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Menyiapkan Framework Flutter versi stabil terbaru
      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. PERINTAH RAHASIA: Otomatis melahirkan folder Android dan file build.gradle yang hilang
      # Parameter --org digunakan agar Package Name aplikasi Anda menjadi Flowa.com secara otomatis
      - name: Generate Android Folder Automatically
        run: flutter create . --platforms=android --org Flowa

      # 5. Memindahkan file google-services.json Anda ke tempat yang tepat setelah folder Android lahir
      - name: Setup Firebase Config File
        run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then
            cp google-services.json android/app/
          elif [ -f android/app/google-services.json ]; then
            echo "File Firebase sudah berada di posisi yang benar."
          else
            echo "Peringatan: File google-services.json belum ditemukan."
          fi

      # 6. Mengunduh semua paket dependency (video_player, firebase, dll)
      - name: Mengunduh Paket Dependencies
        run: flutter pub get

      # 7. Proses Pembuatan APK Ringan Khusus ABI seperti konsep FB Lite
      - name: Build Release APK Dinamis
        run: flutter build apk --release --split-per-abi

      # 8. Mengunggah Hasil APK ke halaman 
