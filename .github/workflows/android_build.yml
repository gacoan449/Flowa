name: Build Android APK (Flowa)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Proses Kompilasi APK Otomatis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. Otomatis membuat folder Android bawaan
      - name: Generate Android Folder Automatically
        run: |
          flutter create . --platforms=android --org Flowa
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>' android/app/src/main/AndroidManifest.xml

      # 2. PERBAIKAN TOTAL: Memaksa penyalinan file google-services.json ke folder tujuan Android yang sah secara ketat
      - name: Setup Firebase Config File
        run: |
          mkdir -p android/app
          if [ -f google-services.json ]; then
            cp -f google-services.json android/app/google-services.json
            echo "SUKSES: File Firebase berhasil disalin ke folder Android App utama!"
          else
            echo "PERINGATAN: File google-services.json tidak ditemukan di folder utama root repositori."
          fi

      - name: Mengunduh Paket Dependencies
        run: flutter pub get

      # 3. Menyuntikkan pembuatan ikon kustom otomatis jika logo.png ada
      - name: Generate App Launcher Icons
        run: |
          if [ -f logo.png ]; then
            flutter pub run flutter_launcher_icons
          else
            echo "Melewati pembuatan ikon kustom karena logo.png tidak ditemukan."
          fi

      # 4. Build 1 APK Universal agar langsung siap sebar ke warga lewat WhatsApp
      - name: Build APK Release Universal
        run: flutter build apk --release

      # 5. Mengunggah file app-release.apk tunggal bersih membawa kunci Firebase
      - name: Upload File APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Flowa-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
